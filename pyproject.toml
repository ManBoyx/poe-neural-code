[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poe-neural-code"
version = "0.2.0"
description = "Eclipse (nom de code POE · Neural Code) — agent de programmation en terminal avec mémoire externe structurée"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "LicenseRef-Proprietary" }
dependencies = ["textual>=0.80", "httpx>=0.27", "pydantic>=2.5", "mcp>=1.2", "jsonschema>=4"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
poe-neural-code = "poe_neural_code.__main__:main"
eclipse = "poe_neural_code.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
