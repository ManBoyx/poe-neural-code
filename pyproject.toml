[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poe-neural-code"
version = "4.0.0"
description = "Eclipse (nom de code POE · Neural Code) — agent de programmation en terminal avec mémoire externe structurée"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "LicenseRef-Proprietary" }
dependencies = ["textual>=0.80", "httpx>=0.27", "pydantic>=2.5", "mcp>=1.2", "jsonschema>=4", "keyring>=25"]

[project.optional-dependencies]
dev = ["pytest>=8"]
e2e = ["playwright>=1.50"]

[project.scripts]
poe-neural-code = "poe_neural_code.__main__:main"
eclipse = "poe_neural_code.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"poe_neural_code.web" = ["static/*", "static/assets/*"]
"poe_neural_code" = ["cg_sdk/*.mjs", "cg_sdk/package.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
