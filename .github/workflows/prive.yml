# Préversion privée : construit les fichiers téléchargeables (application desktop + CLI) et les joint à une Release
# de CE dépôt (privé, visible seulement par vous). Rien n'est publié dans eclipse-releases.
# Aucun secret requis : ces fichiers ne sont pas signés pour la mise à jour automatique (installation manuelle).
# Lancement : onglet Actions > « Préversion privée » > Run workflow, ou : gh workflow run prive.yml -f plateformes=toutes
name: Préversion privée
on:
  workflow_dispatch:
    inputs:
      plateformes:
        description: Plateformes à construire
        type: choice
        options: [toutes, windows, linux]
        default: toutes
permissions:
  contents: write
concurrency:
  group: prive
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        run: echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)" >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    if: inputs.plateformes != 'windows'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Interface graphique (copiée dans le paquet Python)
        shell: bash
        run: |
          (cd desktop && npm ci --no-fund && npm run build)
          rm -rf src/poe_neural_code/web/static && cp -r desktop/dist src/poe_neural_code/web/static
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Moteur et CLI (PyInstaller, paquet Python)
        run: |
          python -m pip install . pyinstaller
          pyinstaller --noconfirm --log-level WARN --distpath build/engine/dist --workpath build/engine/work packaging/engine/eclipse-engine.spec
          build/engine/dist/eclipse-engine/eclipse-engine --version
          packaging/cli/make-cli.sh "${{ needs.version.outputs.version }}"
          python -m pip wheel . --no-deps -w build/cli/
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop/src-tauri
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev rpm
      - name: Application desktop
        working-directory: desktop
        env:
          NO_STRIP: "1"
        run: npx tauri build --bundles appimage,deb,rpm --config src-tauri/local-build.json
      - run: |
          mkdir out
          cp desktop/src-tauri/target/release/bundle/appimage/*.AppImage desktop/src-tauri/target/release/bundle/deb/*.deb \
             desktop/src-tauri/target/release/bundle/rpm/*.rpm build/cli/*.tar.gz build/cli/*.whl out/
          ls -la out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: out/
          if-no-files-found: error

  windows:
    needs: version
    if: inputs.plateformes != 'linux'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Interface graphique (copiée dans le paquet Python)
        shell: bash
        run: |
          (cd desktop && npm ci --no-fund && npm run build)
          rm -rf src/poe_neural_code/web/static && cp -r desktop/dist src/poe_neural_code/web/static
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Moteur et CLI (PyInstaller)
        shell: pwsh
        run: |
          python -m pip install . pyinstaller
          pyinstaller --noconfirm --log-level WARN --distpath build/engine/dist --workpath build/engine/work packaging/engine/eclipse-engine.spec
          build/engine/dist/eclipse-engine/eclipse-engine.exe --version
          ./packaging/cli/make-cli.ps1 -Version "${{ needs.version.outputs.version }}"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop/src-tauri
      - name: Application desktop (installateur, MSI)
        working-directory: desktop
        shell: pwsh
        run: npx tauri build --bundles nsis,msi --config src-tauri/local-build.json
      - name: Version portable
        shell: pwsh
        run: ./packaging/windows/make-portable.ps1 -Version "${{ needs.version.outputs.version }}" -Target desktop/src-tauri/target/release
      - shell: pwsh
        run: |
          New-Item -ItemType Directory out | Out-Null
          Copy-Item desktop/src-tauri/target/release/bundle/nsis/*.exe out/
          Copy-Item desktop/src-tauri/target/release/bundle/msi/*.msi out/
          Copy-Item build/portable/*.zip out/
          Copy-Item build/cli/*.zip out/
          Get-ChildItem out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: out/
          if-no-files-found: error

  publier:
    name: Release privée
    needs: [version, linux, windows]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: prive-v${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          merge-multiple: true
      - name: Joindre les fichiers à la Release (créée si besoin, fichiers remplacés)
        run: |
          ls -la out
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --prerelease --target "$GITHUB_SHA" \
            --title "Eclipse ${{ needs.version.outputs.version }} (préversion privée)" --notes "Construite par le workflow « Préversion privée »."
          gh release upload "$TAG" out/* --clobber
