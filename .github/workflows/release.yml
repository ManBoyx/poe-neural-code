# Publication d'une version : à chaque tag vX.Y.Z (stable) ou vX.Y.Z-beta.N (bêta).
# Construit Linux (AppImage, deb, rpm) et Windows (NSIS, MSI, portable), signe les paquets de mise à jour,
# puis publie dans le dépôt PUBLIC de distribution (aucun code source n'y est copié).
#
# Secrets requis (Settings > Secrets and variables > Actions) — à créer vous-même, jamais dans le dépôt :
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD  (docs/MISES-A-JOUR.md)
#   RELEASES_TOKEN  (jeton fine-grained : dépôt eclipse-releases uniquement, Contents en lecture/écriture)
name: Publication
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  RELEASES_REPO: ManBoyx/eclipse-releases

jobs:
  verifier:
    name: Vérifications avant publication
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        name: Version du tag = versions du projet, clé publique présente, CHANGELOG renseigné
        run: |
          V="${GITHUB_REF_NAME#v}"
          python3 - "$V" <<'PY'
          import json, re, sys, tomllib
          v = sys.argv[1]
          conf = json.load(open("desktop/src-tauri/tauri.conf.json"))
          py = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          errs = []
          if conf["version"] != v: errs.append(f"tauri.conf.json = {conf['version']}")
          if py != v: errs.append(f"pyproject.toml = {py}")
          if not conf["plugins"]["updater"]["pubkey"].strip(): errs.append("clé publique de mise à jour vide (docs/MISES-A-JOUR.md)")
          if not re.search(rf"^##\s+\[?v?{re.escape(v)}\b", open("CHANGELOG.md", encoding="utf-8").read(), re.M):
              errs.append(f"aucune section « ## {v} » dans CHANGELOG.md")
          if errs: sys.exit(f"tag v{v} : " + " ; ".join(errs))
          PY
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [[ "$V" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

  linux:
    name: Linux (AppImage, deb, rpm)
    needs: verifier
    runs-on: ubuntu-22.04 # glibc 2.35 : compatible avec la plupart des distributions récentes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Moteur Eclipse (PyInstaller)
        run: |
          python -m pip install . pyinstaller
          pyinstaller --noconfirm --log-level WARN --distpath build/engine/dist --workpath build/engine/work packaging/engine/eclipse-engine.spec
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop/src-tauri
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev rpm
      - name: Paquets signés
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NO_STRIP: "1"
        run: |
          npm ci --no-fund
          npx tauri build --bundles appimage,deb,rpm
      - run: |
          mkdir out
          cp desktop/src-tauri/target/release/bundle/appimage/*.AppImage* out/
          cp desktop/src-tauri/target/release/bundle/deb/*.deb* out/
          cp desktop/src-tauri/target/release/bundle/rpm/*.rpm* out/
          ls -la out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: out/
          if-no-files-found: error

  windows:
    name: Windows (NSIS, MSI, portable)
    needs: verifier
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Moteur Eclipse (PyInstaller)
        run: |
          python -m pip install . pyinstaller
          pyinstaller --noconfirm --log-level WARN --distpath build/engine/dist --workpath build/engine/work packaging/engine/eclipse-engine.spec
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop/src-tauri
      - name: "Installateurs signés (WiX refuse les numéros de préversion : pas de MSI en bêta)"
        working-directory: desktop
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm ci --no-fund
          $bundles = if ("${{ needs.verifier.outputs.prerelease }}" -eq "true") { "nsis" } else { "nsis,msi" }
          npx tauri build --bundles $bundles
      - name: Version portable
        shell: pwsh
        run: ./packaging/windows/make-portable.ps1 -Version "${{ needs.verifier.outputs.version }}" -Target desktop/src-tauri/target/release
      - shell: pwsh
        run: |
          New-Item -ItemType Directory out | Out-Null
          Copy-Item desktop/src-tauri/target/release/bundle/nsis/*.exe* out/
          if (Test-Path desktop/src-tauri/target/release/bundle/msi) { Copy-Item desktop/src-tauri/target/release/bundle/msi/*.msi* out/ }
          Copy-Item build/portable/*.zip out/
          Get-ChildItem out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: out/
          if-no-files-found: error

  publier:
    name: Publication dans le dépôt de distribution
    needs: [verifier, linux, windows]
    runs-on: ubuntu-latest
    env:
      V: ${{ needs.verifier.outputs.version }}
      GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Manifeste de mise à jour et sommes SHA-256
        run: python3 packaging/release/make_manifest.py --version "$V" --repo "$RELEASES_REPO" --dir dist --changelog CHANGELOG.md
      - name: Copies à nom fixe (liens « dernière version » du README)
        working-directory: dist
        run: |
          cp "Eclipse_${V}_amd64.AppImage" Eclipse_amd64.AppImage
          cp "Eclipse_${V}_amd64.deb" Eclipse_amd64.deb
          cp Eclipse-*.x86_64.rpm Eclipse_x86_64.rpm
          cp "Eclipse_${V}_x64-setup.exe" Eclipse_x64-setup.exe
          cp "Eclipse_${V}_x64_portable.zip" Eclipse_x64_portable.zip
          if ls Eclipse_*_x64_fr-FR.msi >/dev/null 2>&1; then cp Eclipse_*_x64_fr-FR.msi Eclipse_x64.msi; fi
          # SHA256SUMS couvre aussi ces copies
          sha256sum $(ls | grep -vE '\.sig$|^latest\.json$|^SHA256SUMS') > SHA256SUMS
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Signature de SHA256SUMS (vérifiable avec minisign) et script d'installation
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npx --yes @tauri-apps/cli@2.12.4 signer sign dist/SHA256SUMS
          base64 -d dist/SHA256SUMS.sig > dist/SHA256SUMS.minisig && rm dist/SHA256SUMS.sig
          PUB=$(python3 -c "import json;print(json.load(open('desktop/src-tauri/tauri.conf.json'))['plugins']['updater']['pubkey'])" | base64 -d | tail -1)
          sed "s|^PUBKEY=\"\"|PUBKEY=\"$PUB\"|" packaging/release/install.sh > dist/install.sh
          grep -q "^PUBKEY=\"RW" dist/install.sh
      - name: Release GitHub
        run: |
          python3 -c "import json;print(json.load(open('dist/latest.json'))['notes'] or 'Voir CHANGELOG.md')" > notes.md
          flags=""; [ "${{ needs.verifier.outputs.prerelease }}" = "true" ] && flags="--prerelease"
          gh release create "v$V" --repo "$RELEASES_REPO" --title "Eclipse $V" --notes-file notes.md $flags dist/*
      - name: Canal bêta (reçoit toutes les versions, stables et bêta)
        run: |
          gh release view beta-channel --repo "$RELEASES_REPO" >/dev/null 2>&1 || \
            gh release create beta-channel --repo "$RELEASES_REPO" --prerelease --title "Canal bêta" \
              --notes "Manifeste du canal bêta lu par l'application. Ne pas télécharger ici : voir les versions."
          gh release upload beta-channel dist/latest.json --clobber --repo "$RELEASES_REPO"
      - name: README, licence, CHANGELOG et manifeste Scoop du dépôt public
        if: needs.verifier.outputs.prerelease == 'false'
        run: |
          gh repo clone "$RELEASES_REPO" public -- --depth 1
          cp packaging/release/public/README.md LICENSE CHANGELOG.md SECURITY.md public/
          mkdir -p public/bucket
          HASH=$(sha256sum "dist/Eclipse_${V}_x64_portable.zip" | cut -d' ' -f1)
          sed -e "s/@VERSION@/$V/g" -e "s/@HASH@/$HASH/g" packaging/windows/scoop-eclipse.json > public/bucket/eclipse.json
          cd public
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Version $V"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${RELEASES_REPO}.git" HEAD
