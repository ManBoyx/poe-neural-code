# Vérifications à chaque envoi : tests du moteur sous Linux ET Windows, tests Rust et typage de l'interface.
name: CI
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  moteur:
    name: Moteur Python (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]" pip-audit
      - run: python -m pytest -q
      - name: Audit des dépendances Python
        run: pip-audit --skip-editable

  cli:
    name: CLI TypeScript (Bun, OpenTUI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm install -g bun@1.4.5
      - name: bubblewrap (sandbox et garde des fichiers d'Eclipse testées pour de vrai, pas sautées)
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --dev-bind / / --unshare-pid --proc /proc true
      - working-directory: ts
        env:
          ECLIPSE_REQUIRE_BWRAP: "1"
        run: |
          bun install --frozen-lockfile
          bun x tsc --noEmit
          bun test
      - name: Exécutable autonome (Linux x86-64)
        run: |
          bun packaging/cli-ts/build.ts bun-linux-x64-baseline > build-cli.log 2>&1 || { grep -v '^Downloading' build-cli.log | tail -30; exit 1; }
          build/cli-ts/linux-x64-baseline/Eclipse --version
          python3 -m pip install --user pyte
          python3 packaging/cli-ts/smoke.py build/cli-ts/linux-x64-baseline/Eclipse

  desktop:
    name: Application desktop (Rust + interface)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop/src-tauri
      - name: Dépendances système (WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - working-directory: desktop
        run: |
          npm ci --no-fund
          npx tsc --noEmit
          npm run build
          npm audit --omit=dev
      - name: "Tests Rust (dont signature et montée 0.2 -> 0.3 avec des clés JETABLES générées ici)"
        run: |
          packaging/release/prepare-signtest.sh "$RUNNER_TEMP/signtest"
          cd desktop/src-tauri
          ECLIPSE_SIGNTEST="$RUNNER_TEMP/signtest" cargo test --release -- --test-threads=1

  android:
    name: Application Android (tests JVM, dont un vrai serveur SSH)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

  audit:
    name: "Audit des dépendances (OSV : RustSec, GitHub, PyPI, npm, Maven)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "osv-scanner (avis acceptés et justifiés dans osv-scanner.toml)"
        run: |
          curl -fsSL -o osv-scanner https://github.com/google/osv-scanner/releases/download/v2.7.1/osv-scanner_linux_amd64
          chmod +x osv-scanner
          ./osv-scanner scan source --config osv-scanner.toml -L desktop/src-tauri/Cargo.lock -L desktop/package-lock.json

  interface:
    name: "Interface : tests de bout en bout (navigateur sans fenêtre, faux fournisseur)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: |
          python -m pip install -e ".[dev,e2e]"
          python -m playwright install --with-deps chromium-headless-shell
      - run: PYTHON=python packaging/test-ui.sh
